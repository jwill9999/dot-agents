version: 1
id: codex
name: codex
servers:
    - type: image
      secrets: default
      image: mcp/playwright@sha256:0855e87ff53866b87b4946903f114c4da96ef8757a1dda9233c5c7c4d6cc7cdb
      snapshot:
        server:
            name: playwright
            type: server
            image: mcp/playwright@sha256:0855e87ff53866b87b4946903f114c4da96ef8757a1dda9233c5c7c4d6cc7cdb
            description: Playwright MCP server.
            title: Playwright
            icon: https://avatars.githubusercontent.com/u/6154722?v=4
            readme: http://desktop.docker.com/mcp/catalog/v3/readme/playwright.md
            longLived: true
            remote: {}
            tools:
                - name: browser_click
                  description: Perform click on a web page
                  arguments:
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: button
                      type: string
                      desc: Button to click, defaults to left
                      optional: true
                    - name: doubleClick
                      type: boolean
                      desc: Whether to perform a double click instead of a single click
                      optional: true
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                    - name: modifiers
                      type: array
                      items:
                        type: string
                      desc: Modifier keys to press
                      optional: true
                  annotations:
                    title: Click
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_close
                  description: Close the page
                  arguments: []
                  annotations:
                    title: Close browser
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_console_messages
                  description: Returns all console messages
                  arguments:
                    - name: level
                      type: string
                      desc: Level of the console messages to return. Each level includes the messages of more severe levels. Defaults to "info".
                    - name: all
                      type: boolean
                      desc: Return all console messages since the beginning of the session, not just since the last navigation. Defaults to false.
                      optional: true
                    - name: filename
                      type: string
                      desc: Filename to save the console messages to. If not provided, messages are returned as text.
                      optional: true
                  annotations:
                    title: Get console messages
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
                - name: browser_drag
                  description: Perform drag and drop between two elements
                  arguments:
                    - name: endTarget
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: startTarget
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: endElement
                      type: string
                      desc: Human-readable target element description used to obtain the permission to interact with the element
                      optional: true
                    - name: startElement
                      type: string
                      desc: Human-readable source element description used to obtain the permission to interact with the element
                      optional: true
                  annotations:
                    title: Drag mouse
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_drop
                  description: Drop files or MIME-typed data onto an element, as if dragged from outside the page. At least one of "paths" or "data" must be provided.
                  arguments:
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: data
                      type: object
                      desc: 'Data to drop, as a map of MIME type to string value (e.g. {"text/plain": "hello", "text/uri-list": "https://example.com"}).'
                      optional: true
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                    - name: paths
                      type: array
                      items:
                        type: string
                      desc: Absolute paths to files to drop onto the element.
                      optional: true
                  annotations:
                    title: Drop files or data onto an element
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_evaluate
                  description: Evaluate JavaScript expression on page or element
                  arguments:
                    - name: function
                      type: string
                      desc: () => { /* code */ } or (element) => { /* code */ } when element is provided
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                    - name: filename
                      type: string
                      desc: Filename to save the result to. If not provided, result is returned as text.
                      optional: true
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                      optional: true
                  annotations:
                    title: Evaluate JavaScript
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_file_upload
                  description: Upload one or multiple files
                  arguments:
                    - name: paths
                      type: array
                      items:
                        type: string
                      desc: The absolute paths to the files to upload. Can be single file or multiple files. If omitted, file chooser is cancelled.
                      optional: true
                  annotations:
                    title: Upload files
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_fill_form
                  description: Fill multiple form fields
                  arguments:
                    - name: fields
                      type: array
                      items:
                        type: object
                      desc: Fields to fill in
                  annotations:
                    title: Fill form
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_handle_dialog
                  description: Handle a dialog
                  arguments:
                    - name: accept
                      type: boolean
                      desc: Whether to accept the dialog.
                    - name: promptText
                      type: string
                      desc: The text of the prompt in case of a prompt dialog.
                      optional: true
                  annotations:
                    title: Handle a dialog
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_hover
                  description: Hover over element on page
                  arguments:
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                  annotations:
                    title: Hover mouse
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_navigate
                  description: Navigate to a URL
                  arguments:
                    - name: url
                      type: string
                      desc: The URL to navigate to
                  annotations:
                    title: Navigate to a URL
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_navigate_back
                  description: Go back to the previous page in the history
                  arguments: []
                  annotations:
                    title: Go back
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_network_request
                  description: Returns full details (headers and body) of a single network request, or a single part if `part` is set. Use the number from browser_network_requests.
                  arguments:
                    - name: index
                      type: integer
                      desc: 1-based index of the request, as printed by browser_network_requests.
                    - name: filename
                      type: string
                      desc: Filename to save the result to. If not provided, output is returned as text.
                      optional: true
                    - name: part
                      type: string
                      desc: Return only this part of the request. Omit to return full details.
                      optional: true
                  annotations:
                    title: Show network request details
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
                - name: browser_network_requests
                  description: Returns a numbered list of network requests since loading the page. Use browser_network_request with the number to get full details.
                  arguments:
                    - name: static
                      type: boolean
                      desc: Whether to include successful static resources like images, fonts, scripts, etc. Defaults to false.
                    - name: filename
                      type: string
                      desc: Filename to save the network requests to. If not provided, requests are returned as text.
                      optional: true
                    - name: filter
                      type: string
                      desc: Only return requests whose URL matches this regexp (e.g. "/api/.*user").
                      optional: true
                  annotations:
                    title: List network requests
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
                - name: browser_press_key
                  description: Press a key on the keyboard
                  arguments:
                    - name: key
                      type: string
                      desc: Name of the key to press or a character to generate, such as `ArrowLeft` or `a`
                  annotations:
                    title: Press a key
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_resize
                  description: Resize the browser window
                  arguments:
                    - name: height
                      type: number
                      desc: Height of the browser window
                    - name: width
                      type: number
                      desc: Width of the browser window
                  annotations:
                    title: Resize browser window
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_run_code_unsafe
                  description: 'Run a Playwright code snippet. Unsafe: executes arbitrary JavaScript in the Playwright server process and is RCE-equivalent.'
                  arguments:
                    - name: code
                      type: string
                      desc: 'A JavaScript function containing Playwright code to execute. It will be invoked with a single argument, page, which you can use for any page interaction. For example: `async (page) => { await page.getByRole(''button'', { name: ''Submit'' }).click(); return await page.title(); }`'
                      optional: true
                    - name: filename
                      type: string
                      desc: Load code from the specified file. If both code and filename are provided, code will be ignored.
                      optional: true
                  annotations:
                    title: Run Playwright code (unsafe)
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_select_option
                  description: Select an option in a dropdown
                  arguments:
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: values
                      type: array
                      items:
                        type: string
                      desc: Array of values to select in the dropdown. This can be a single value or multiple values.
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                  annotations:
                    title: Select option
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_snapshot
                  description: Capture accessibility snapshot of the current page, this is better than screenshot
                  arguments:
                    - name: boxes
                      type: boolean
                      desc: Include each element's bounding box as [box=x,y,width,height] in the snapshot
                      optional: true
                    - name: depth
                      type: number
                      desc: Limit the depth of the snapshot tree
                      optional: true
                    - name: filename
                      type: string
                      desc: Save snapshot to markdown file instead of returning it in the response.
                      optional: true
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                      optional: true
                  annotations:
                    title: Page snapshot
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
                - name: browser_tabs
                  description: List, create, close, or select a browser tab.
                  arguments:
                    - name: action
                      type: string
                      desc: Operation to perform
                    - name: index
                      type: number
                      desc: Tab index, used for close/select. If omitted for close, current tab is closed.
                      optional: true
                    - name: url
                      type: string
                      desc: URL to navigate to in the new tab, used for new.
                      optional: true
                  annotations:
                    title: Manage tabs
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_take_screenshot
                  description: Take a screenshot of the current page. You can't perform actions based on the screenshot, use browser_snapshot for actions.
                  arguments:
                    - name: type
                      type: string
                      desc: Image format for the screenshot. Default is png.
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                    - name: filename
                      type: string
                      desc: File name to save the screenshot to. Defaults to `page-{timestamp}.{png|jpeg}` if not specified. Prefer relative file names to stay within the output directory.
                      optional: true
                    - name: fullPage
                      type: boolean
                      desc: When true, takes a screenshot of the full scrollable page, instead of the currently visible viewport. Cannot be used with element screenshots.
                      optional: true
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                      optional: true
                  annotations:
                    title: Take a screenshot
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
                - name: browser_type
                  description: Type text into editable element
                  arguments:
                    - name: target
                      type: string
                      desc: Exact target element reference from the page snapshot, or a unique element selector
                    - name: text
                      type: string
                      desc: Text to type into the element
                    - name: element
                      type: string
                      desc: Human-readable element description used to obtain permission to interact with the element
                      optional: true
                    - name: slowly
                      type: boolean
                      desc: Whether to type one character at a time. Useful for triggering key handlers in the page. By default entire text is filled in at once.
                      optional: true
                    - name: submit
                      type: boolean
                      desc: Whether to submit entered text (press Enter after)
                      optional: true
                  annotations:
                    title: Type text
                    readOnlyHint: false
                    destructiveHint: true
                    openWorldHint: true
                - name: browser_wait_for
                  description: Wait for text to appear or disappear or a specified time to pass
                  arguments:
                    - name: text
                      type: string
                      desc: The text to wait for
                      optional: true
                    - name: textGone
                      type: string
                      desc: The text to wait for to disappear
                      optional: true
                    - name: time
                      type: number
                      desc: The time to wait in seconds
                      optional: true
                  annotations:
                    title: Wait for
                    readOnlyHint: true
                    destructiveHint: false
                    openWorldHint: true
            metadata:
                pulls: 1506157
                stars: 32
                githubStars: 31922
                category: devops
                tags:
                    - playwright
                    - devops
                license: Apache License 2.0
                owner: microsoft
    - type: image
      config:
        org: jwill9999
        url: https://sonarcloud.io
      secrets: default
      image: mcp/sonarqube@sha256:3e33c8beed9987fdb34288bcde40afc83746fb04e0c3f603cbc1cc6463a6f5c2
      snapshot:
        server:
            name: sonarqube
            type: server
            image: mcp/sonarqube@sha256:3e33c8beed9987fdb34288bcde40afc83746fb04e0c3f603cbc1cc6463a6f5c2
            description: Interact with SonarQube Cloud, Server and Community build over the web API. Analyze code to identify quality and security issues.
            title: SonarQube
            icon: https://avatars.githubusercontent.com/u/545988?s=200&v=4
            readme: http://desktop.docker.com/mcp/catalog/v3/readme/sonarqube.md
            remote: {}
            secrets:
                - name: sonarqube.token
                  env: SONARQUBE_TOKEN
            env:
                - name: SONARQUBE_URL
                  value: '{{sonarqube.url}}'
                - name: SONARQUBE_ORG
                  value: '{{sonarqube.org}}'
            tools:
                - name: analyze_code_snippet
                  description: Analyze a file or code snippet with SonarQube analyzers to identify code quality and security issues
                  arguments:
                    - name: language
                      type: string
                      desc: Language of the code snippet
                    - name: code_snippet
                      type: string
                      desc: Code snippet to analyze
                - name: analyze_file_list
                  description: Analyze files in the current working directory using SonarQube for IDE
                  arguments:
                    - name: file_absolute_paths
                      type: array
                      desc: List of absolute file paths to analyze
                - name: toggle_automatic_analysis
                  description: Enable or disable SonarQube for IDE automatic analysis
                  arguments:
                    - name: enabled
                      type: boolean
                      desc: Enable or disable the automatic analysis
                - name: search_sonar_issues_in_projects
                  description: Search for SonarQube issues in my organization's projects
                  arguments:
                    - name: projects
                      type: array
                      desc: An optional list of Sonar projects to look in
                    - name: pullRequestId
                      type: string
                      desc: The identifier of the Pull Request to look in
                    - name: severities
                      type: string
                      desc: 'An optional list of severities to filter by, separated by a comma. Possible values: INFO, LOW, MEDIUM, HIGH, BLOCKER'
                    - name: page
                      type: number
                      desc: An optional page number. Defaults to 1
                    - name: pageSize
                      type: number
                      desc: An optional page size. Must be greater than 0 and less than or equal to 500. Defaults to 100
                - name: change_sonar_issue_status
                  description: Change the status of a SonarQube issue
                  arguments:
                    - name: issue_key
                      type: string
                      desc: Key of the issue to modify
                    - name: transition
                      type: string
                      desc: Transition to apply to the issue
                - name: search_my_sonarqube_projects
                  description: Find SonarQube projects. The response is paginated
                  arguments:
                    - name: page
                      type: string
                      desc: An optional page number. Defaults to 1
                - name: list_quality_gates
                  description: List all quality gates in my SonarQube
                  arguments: []
                - name: get_project_quality_gate_status
                  description: Get the quality gate status for a project
                  arguments:
                    - name: analysisId
                      type: string
                      desc: The optional analysis ID to get the status for
                    - name: branch
                      type: string
                      desc: The optional branch key to get the status for
                    - name: projectId
                      type: string
                      desc: The optional project ID
                    - name: projectKey
                      type: string
                      desc: The optional project key to get the status for
                    - name: pullRequest
                      type: string
                      desc: The optional pull request ID to get the status for
                - name: show_rule
                  description: Shows detailed information about a SonarQube rule
                  arguments:
                    - name: key
                      type: string
                      desc: Rule key
                - name: list_rule_repositories
                  description: List rule repositories available in SonarQube
                  arguments:
                    - name: language
                      type: string
                      desc: Optional language key to filter repositories
                    - name: q
                      type: string
                      desc: Optional search query to filter repositories by name or key
                - name: list_languages
                  description: List all programming languages supported in this SonarQube instance
                  arguments:
                    - name: q
                      type: string
                      desc: Optional pattern to match language keys/names against
                - name: get_component_measures
                  description: Get SonarQube measures for a project, such as ncloc, complexity, violations, coverage, etc
                  arguments:
                    - name: projectKey
                      type: string
                      desc: The project key
                    - name: branch
                      type: string
                      desc: The branch to analyze for measures
                    - name: metricKeys
                      type: array
                      desc: The metric keys to retrieve
                    - name: pullRequest
                      type: string
                      desc: The pull request identifier to analyze for measures
                - name: search_metrics
                  description: Search for SonarQube metrics
                  arguments:
                    - name: page
                      type: number
                      desc: '1-based page number (default: 1)'
                    - name: pageSize
                      type: number
                      desc: 'Page size. Must be greater than 0 and less than or equal to 500 (default: 100)'
                - name: get_raw_source
                  description: Get source code as raw text from SonarQube. Require 'See Source Code' permission on file
                  arguments:
                    - name: key
                      type: string
                      desc: File key
                    - name: branch
                      type: string
                      desc: Branch key
                    - name: pullRequest
                      type: string
                      desc: Pull request id
                - name: get_scm_info
                  description: Get SCM information of SonarQube source files. Require See Source Code permission on file's project
                  arguments:
                    - name: key
                      type: string
                      desc: File key
                    - name: commitsByLine
                      type: boolean
                      desc: Group lines by SCM commit if value is false, else display commits for each line
                    - name: from
                      type: number
                      desc: First line to return. Starts at 1
                    - name: to
                      type: number
                      desc: Last line to return (inclusive)
                - name: get_system_health
                  description: Get the health status of SonarQube Server instance. Returns GREEN, YELLOW, or RED
                  arguments: []
                - name: get_system_status
                  description: Get state information about SonarQube Server. Returns status, version, and id
                  arguments: []
                - name: get_system_logs
                  description: Get SonarQube Server system logs in plain-text format. Requires system administration permission
                  arguments:
                    - name: name
                      type: string
                      desc: 'Name of the logs to get. Possible values: access, app, ce, deprecation, es, web. Default: app'
                - name: ping_system
                  description: Ping the SonarQube Server system to check if it's alive. Returns 'pong' as plain text
                  arguments: []
                - name: get_system_info
                  description: Get detailed information about SonarQube Server system configuration including JVM state, database, search indexes, and settings. Requires 'Administer' permissions
                  arguments: []
                - name: create_webhook
                  description: Create a new webhook for the SonarQube organization or project. Requires 'Administer' permission
                  arguments:
                    - name: name
                      type: string
                      desc: Name of the webhook
                    - name: url
                      type: string
                      desc: Server endpoint that will receive the webhook payload
                    - name: project
                      type: string
                      desc: The key of the project that will own the webhook
                    - name: secret
                      type: string
                      desc: If provided, secret will be used as the key to generate the HMAC hex digest value
                - name: list_webhooks
                  description: List all webhooks for the SonarQube organization or project. Requires 'Administer' permission
                  arguments:
                    - name: project
                      type: string
                      desc: Optional project key to list project-specific webhooks
                - name: list_portfolios
                  description: List portfolios available in SonarQube with filtering and pagination options
                  arguments:
                    - name: enterpriseId
                      type: string
                      desc: Enterprise uuid (SonarQube Cloud only)
                    - name: q
                      type: string
                      desc: Search query to filter portfolios by name
                    - name: favorite
                      type: boolean
                      desc: If true, only returns favorite portfolios
                    - name: draft
                      type: boolean
                      desc: If true, only returns drafts created by the logged-in user (SonarQube Cloud only)
                    - name: pageIndex
                      type: number
                      desc: 'Index of the page to fetch (default: 1)'
                    - name: pageSize
                      type: number
                      desc: Size of the page to fetch
                - name: list_enterprises
                  description: List the enterprises available in SonarQube Cloud that you have access to
                  arguments:
                    - name: enterpriseKey
                      type: string
                      desc: Optional enterprise key to filter results
                - name: search_dependency_risks
                  description: Search for software composition analysis issues (dependency risks) of a SonarQube project
                  arguments:
                    - name: projectKey
                      type: string
                      desc: Project key
                    - name: branchKey
                      type: string
                      desc: The branch key
                    - name: pullRequestKey
                      type: string
                      desc: The pull request key
            config:
                - description: Configure the connection to SonarQube
                  name: sonarqube
                  properties:
                    org:
                        description: Organization key for SonarQube Cloud, not required for SonarQube Server or Community Build
                        type: string
                    url:
                        description: URL of the SonarQube instance, to provide only for SonarQube Server or Community Build
                        type: string
                  type: object
            metadata:
                pulls: 424391
                stars: 19
                githubStars: 544
                category: productivity
                tags:
                    - sonarqube
                license: Other
                owner: SonarSource
    - type: image
      secrets: default
      image: mcp/context7@sha256:1174e6a29634a83b2be93ac1fefabf63265f498c02c72201fe3464e687dd8836
      snapshot:
        server:
            name: context7
            type: server
            image: mcp/context7@sha256:1174e6a29634a83b2be93ac1fefabf63265f498c02c72201fe3464e687dd8836
            description: Context7 Platform -- Up-to-date code documentation for LLMs and AI code editors.
            title: Context7
            icon: https://avatars.githubusercontent.com/u/74989412?s=200&v=4
            readme: http://desktop.docker.com/mcp/catalog/v3/readme/context7.md
            remote: {}
            env:
                - name: MCP_TRANSPORT
                  value: stdio
            tools:
                - name: get-library-docs
                  description: Fetches up-to-date documentation for a library. You must call 'resolve-library-id' first to obtain the exact Context7-compatible library ID required to use this tool, UNLESS the user explicitly provides a library ID in the format '/org/project' or '/org/project/version' in their query.
                  arguments:
                    - name: context7CompatibleLibraryID
                      type: string
                      desc: Exact Context7-compatible library ID (e.g., '/mongodb/docs', '/vercel/next.js', '/supabase/supabase', '/vercel/next.js/v14.3.0-canary.87') retrieved from 'resolve-library-id' or directly from user query in the format '/org/project' or '/org/project/version'.
                    - name: tokens
                      type: number
                      desc: 'Maximum number of tokens of documentation to retrieve (default: 10000). Higher values provide more context but consume more tokens.'
                      optional: true
                    - name: topic
                      type: string
                      desc: Topic to focus documentation on (e.g., 'hooks', 'routing').
                      optional: true
                - name: resolve-library-id
                  description: |-
                    Resolves a package/product name to a Context7-compatible library ID and returns a list of matching libraries.

                    You MUST call this function before 'get-library-docs' to obtain a valid Context7-compatible library ID UNLESS the user explicitly provides a library ID in the format '/org/project' or '/org/project/version' in their query.

                    Selection Process:
                    1. Analyze the query to understand what library/package the user is looking for
                    2. Return the most relevant match based on:
                    - Name similarity to the query (exact matches prioritized)
                    - Description relevance to the query's intent
                    - Documentation coverage (prioritize libraries with higher Code Snippet counts)
                    - Trust score (consider libraries with scores of 7-10 more authoritative)

                    Response Format:
                    - Return the selected library ID in a clearly marked section
                    - Provide a brief explanation for why this library was chosen
                    - If multiple good matches exist, acknowledge this but proceed with the most relevant one
                    - If no good matches exist, clearly state this and suggest query refinements

                    For ambiguous queries, request clarification before proceeding with a best-guess match.
                  arguments:
                    - name: libraryName
                      type: string
                      desc: Library name to search for and retrieve a Context7-compatible library ID.
            metadata:
                pulls: 410082
                stars: 23
                githubStars: 54323
                category: devops
                tags:
                    - context7
                    - devops
                license: MIT License
                owner: upstash
